<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXJ BUSINESS PARTNER SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemBlue: '#0f172a',
                        cardDark: '#1e293b',
                        accentOrange: '#f97316',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .device-simulator { transition: all 0.3s ease-in-out; margin: 0 auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <!-- 顶栏 -->
    <header id="appHeader" class="bg-gemBlue border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg hidden">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-md border border-blue-400/30">
                    LXJ
                </div>
                <div>
                    <h1 class="font-extrabold text-sm md:text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        LXJ BUSINESS PARTNER OS
                    </h1>
                    <p class="text-xs text-slate-400">Empire Command Center</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span id="currentRoleBadge" class="text-xs bg-slate-900 border border-blue-500/50 text-blue-300 px-3 py-1.5 rounded-xl font-medium"></span>
            </div>

            <div class="flex items-center space-x-2">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-1 hidden sm:flex items-center space-x-1">
                    <button onclick="setDeviceMode('phone')" id="btn-phone" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">手机</button>
                    <button onclick="setDeviceMode('tablet')" id="btn-tablet" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">平板</button>
                    <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition">电脑</button>
                </div>

                <select id="langSelect" onchange="changeLanguage()" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    <option value="zh">简中</option>
                    <option value="en">EN</option>
                    <option value="bm">BM</option>
                </select>

                <button onclick="logout()" id="btnLogout" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs px-3 py-1.5 rounded-xl transition font-medium">退出</button>
            </div>
        </div>
    </header>

    <!-- 主体容器 -->
    <main class="w-full p-4 md:p-6 flex-grow flex items-center justify-center">
        
        <!-- 1. 前置登入网关界面 -->
        <div id="loginView" class="w-full max-w-md bg-cardDark border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-2xl mx-auto flex items-center justify-center font-bold text-2xl text-white shadow-lg border border-blue-400/30">
                    LXJ
                </div>
                <h2 id="loginTitle" class="text-xl font-extrabold text-white tracking-wider">LXJ EMPIRE GATEWAY</h2>
                <p id="loginSubtitle" class="text-xs text-slate-400">请选择身份或输入授权凭证登入系统</p>
            </div>

            <!-- 语言切换按钮 -->
            <div class="flex justify-center space-x-2 pb-2">
                <button onclick="setLoginLang('zh')" id="l-zh" class="px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition">简中</button>
                <button onclick="setLoginLang('en')" id="l-en" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition">EN</button>
                <button onclick="setLoginLang('bm')" id="l-bm" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition">BM</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label id="lblRoleSelect" class="block text-xs font-medium text-slate-300 mb-1.5">选择登入角色身份</label>
                    <select id="loginRoleSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="super-admin">Super Admin (最高统帅)</option>
                        <option value="platinum-vip">Platinum VIP (白金VIP / 3%金池)</option>
                        <option value="standard-vip">Standard VIP (标准VIP)</option>
                        <option value="business-owner">Business Owner (业务主理人)</option>
                        <option value="operator-team">Operator Team (执行团队)</option>
                    </select>
                </div>

                <div>
                    <label id="lblToken" class="block text-xs font-medium text-slate-300 mb-1.5">安全授权令牌 / Security Token</label>
                    <input type="password" id="loginTokenInput" value="lxj-security-2026" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                </div>

                <button onclick="handleLogin()" id="btnLoginText" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition tracking-wider">
                    安全登入指挥系统
                </button>
            </div>
        </div>

        <!-- 2. 主指挥工作台界面 -->
        <div id="dashboardView" class="w-full max-w-7xl device-simulator space-y-6 hidden">
            <div id="dynamicMainContent" class="space-y-6">
                <!-- 动态渲染区域 -->
            </div>
        </div>

    </main>

    <footer class="bg-gemBlue border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500 mt-12">
        <p class="font-medium tracking-widest text-slate-400">LXJ BUSINESS SYSTEM SINCE 2026 - EMPIRE COMMAND</p>
    </footer>

    <script>
        let currentLang = 'zh';
        let loggedInRole = '';

        const langData = {
            zh: {
                loginTitle: "LXJ EMPIRE GATEWAY",
                loginSubtitle: "请选择身份或输入授权凭证登入系统",
                lblRoleSelect: "选择登入角色身份",
                lblToken: "安全授权令牌 / Security Token",
                btnLoginText: "安全登入指挥系统",
                logoutBtn: "退出登入",
                
                superAdminTitle: "Super Admin 最高统帅指挥舱",
                superAdminDesc: "全局掌控核心利润、模块金池收益、VIP 与 Business Owner 同源工作台流水线",
                netProfit: "统帅实际净利润大盘",
                vipCommission: "白金 VIP 模块金池收益",
                teamEffort: "团队协助管理效能",
                
                platTitle: "白金 VIP 专属尊贵大盘 (同源工作台)",
                platDesc: "欢迎尊贵的白金 VIP。您享有与主理人同源的工作图架构，专属享有模块金池的 3% 利润率分配。",
                
                stdTitle: "标准 VIP 专属特权区 (同源工作台)",
                stdDesc: "欢迎标准 VIP。您享有同源的工作台面板与日常业务支持，模块应用权限按标准协议执行。",
                
                boTitle: "Business Owner 业务主理人工作台",
                boDesc: "主理人与 VIP 共享同源的工作台界面与任务面板，专职负责统筹底层 Operator 团队（1至5）。",
                
                opTitle: "Operator 团队执行端",
                opDesc: "全体 Operator 严格执行底层业务任务，保障各项流水平稳运行。",
                
                taskPlaceholder: "输入要下发给 Operator 团队的工作任务...",
                taskBtn: "下发团队任务",
                alertMsg: "任务已成功下发给 Operator 团队！",
                moduleLimit: "模块应用限制：当前角色享有独立的权限边界与分配率",
                roleNames: {
                    'super-admin': 'Super Admin 最高统帅',
                    'platinum-vip': 'Platinum VIP (3%金池)',
                    'standard-vip': 'Standard VIP',
                    'business-owner': 'Business Owner',
                    'operator-team': 'Operator 团队'
                }
            },
            en: {
                loginTitle: "LXJ EMPIRE GATEWAY",
                loginSubtitle: "Select role and enter authorization token to login",
                lblRoleSelect: "Select Role Identity",
                lblToken: "Security Token",
                btnLoginText: "Secure Login to Command System",
                logoutBtn: "Logout",
                
                superAdminTitle: "Super Admin Supreme Command",
                superAdminDesc: "Global control over net profit, module pool margin, and isomorphic VIP/Owner workbenches",
                netProfit: "Net Profit Dashboard",
                vipCommission: "Platinum VIP Module Pool",
                teamEffort: "Team Management Efficiency",
                
                platTitle: "Platinum VIP Exclusive Dashboard (Isomorphic Workbench)",
                platDesc: "Welcome honored Platinum VIP. You share the isomorphic workbench layout, exclusively entitled to a 3% profit margin from the module pool.",
                
                stdTitle: "Standard VIP Partner Zone (Isomorphic Workbench)",
                stdDesc: "Welcome Standard VIP. You share the isomorphic workbench layout with standard module restrictions.",
                
                boTitle: "Business Owner Operations Workbench",
                boDesc: "Business Owners share the identical workbench layout with VIPs, focusing on managing the Operator Team (1 to 5).",
                
                opTitle: "Operator Team Execution Unit",
                opDesc: "Operators strictly execute daily business tasks to ensure smooth operations.",
                
                taskPlaceholder: "Assign task to Operator Team...",
                taskBtn: "Assign Team Task",
                alertMsg: "Task successfully assigned to Operator Team!",
                moduleLimit: "Module Restriction: Role-based permission boundaries and allocation applied",
                roleNames: {
                    'super-admin': 'Super Admin',
                    'platinum-vip': 'Platinum VIP (3% Pool)',
                    'standard-vip': 'Standard VIP',
                    'business-owner': 'Business Owner',
                    'operator-team': 'Operator Team'
                }
            },
            bm: {
                loginTitle: "LXJ EMPIRE GATEWAY",
                loginSubtitle: "Pilih peranan dan masukkan token keselamatan untuk log masuk",
                lblRoleSelect: "Pilih Peranan Identiti",
                lblToken: "Token Keselamatan",
                btnLoginText: "Log Masuk Selamat ke Sistem",
                logoutBtn: "Log Keluar",
                
                superAdminTitle: "Super Admin Kawalan Tertinggi",
                superAdminDesc: "Kawalan penuh ke atas keuntungan bersih, margin kolam modul, dan papan kerja isomorfik VIP/Owner",
                netProfit: "Papan Pemuka Keuntungan Bersih",
                vipCommission: "Kolam Modul Platinum VIP",
                teamEffort: "Kecekapan Pengurusan Pasukan",
                
                platTitle: "Papan Pemuka Eksklusif Platinum VIP (Workbenched Isomorfik)",
                platDesc: "Selamat datang Platinum VIP. Anda berkongsi reka bentuk papan kerja isomorfik yang sama, menikmati 3% margin keuntungan daripada kolam modul.",
                
                stdTitle: "Zon VIP Standard (Workbenched Isomorfik)",
                stdDesc: "Selamat datang Standard VIP. Anda berkongsi antara muka papan kerja yang sama dengan had modul standard.",
                
                boTitle: "Papan Pemuka Business Owner",
                boDesc: "Business Owner berkongsi reka bentuk papan kerja yang sama seperti VIP, fokus menguruskan Pasukan Operator (1 hingga 5).",
                
                opTitle: "Unit Pelaksanaan Pasukan Operator",
                opDesc: "Semua Operator melaksanakan tugasan perniagaan harian dengan ketat.",
                
                taskPlaceholder: "Masukkan tugasan untuk Pasukan Operator...",
                taskBtn: "Hantar Tugasan Pasukan",
                alertMsg: "Tugasan berjaya dihantar kepada Pasukan Operator!",
                moduleLimit: "Had Modul: Batasan kebenaran dan nisbah peruntukan berasaskan peranan",
                roleNames: {
                    'super-admin': 'Super Admin',
                    'platinum-vip': 'Platinum VIP (Kolam 3%)',
                    'standard-vip': 'Standard VIP',
                    'business-owner': 'Business Owner',
                    'operator-team': 'Pasukan Operator'
                }
            }
        };

        function setLoginLang(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            
            ['zh', 'en', 'bm'].forEach(l => {
                const btn = document.getElementById(`l-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition";
                }
            });

            const t = langData[lang];
            document.getElementById('loginTitle').innerText = t.loginTitle;
            document.getElementById('loginSubtitle').innerText = t.loginSubtitle;
            document.getElementById('lblRoleSelect').innerText = t.lblRoleSelect;
            document.getElementById('lblToken').innerText = t.lblToken;
            document.getElementById('btnLoginText').innerText = t.btnLoginText;
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            setLoginLang(currentLang);
            if (loggedInRole) {
                renderDashboard();
            }
        }

        function handleLogin() {
            const role = document.getElementById('loginRoleSelect').value;
            const token = document.getElementById('loginTokenInput').value;

            if (!token) {
                alert("Please enter security token!");
                return;
            }

            loggedInRole = role;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appHeader').classList.remove('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');

            renderDashboard();
        }

        function logout() {
            loggedInRole = '';
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('appHeader').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        function setDeviceMode(mode) {
            const wrapper = document.getElementById('dashboardView');
            const btnPhone = document.getElementById('btn-phone');
            const btnTablet = document.getElementById('btn-tablet');
            const btnDesktop = document.getElementById('btn-desktop');

            [btnPhone, btnTablet, btnDesktop].forEach(b => {
                b.className = "px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition";
            });

            if (mode === 'phone') {
                wrapper.style.maxWidth = '390px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '32px';
                wrapper.style.padding = '12px';
                btnPhone.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else if (mode === 'tablet') {
                wrapper.style.maxWidth = '768px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '24px';
                wrapper.style.padding = '16px';
                btnTablet.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else {
                wrapper.style.maxWidth = '1280px';
                wrapper.style.border = 'none';
                wrapper.style.borderRadius = '0';
                wrapper.style.padding = '0';
                btnDesktop.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            }
        }

        function renderDashboard() {
            const t = langData[currentLang];
            const container = document.getElementById('dynamicMainContent');
            
            document.getElementById('currentRoleBadge').innerText = t.roleNames[loggedInRole];
            document.getElementById('btnLogout').innerText = t.logoutBtn;

            if (loggedInRole === 'super-admin') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">${t.superAdminTitle}</h2>
                                <p class="text-xs text-slate-400 mt-1">${t.superAdminDesc}</p>
                            </div>
                            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-medium">Active</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">${t.netProfit}</span>
                                <div class="text-3xl font-black text-emerald-400 mt-2">12,450 <span class="text-xs text-slate-400">MYR</span></div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">${t.vipCommission}</span>
                                <div class="text-3xl font-black text-amber-400 mt-2">3% Pool Margin</div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">${t.teamEffort}</span>
                                <div class="text-3xl font-black text-purple-400 mt-2">Optimized</div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (loggedInRole === 'platinum-vip' || loggedInRole === 'standard-vip' || loggedInRole === 'business-owner') {
                let title = t.boTitle, desc = t.boDesc, badge = "Business Owner", badgeColor = "bg-purple-500/20 text-purple-300", marginInfo = "Standard Protocol";
                
                if (loggedInRole === 'platinum-vip') {
                    title = t.platTitle; desc = t.platDesc; badge = "Platinum VIP (3% Pool)"; badgeColor = "bg-amber-500/20 text-amber-300"; marginInfo = "3% Module Pool Margin";
                } else if (loggedInRole === 'standard-vip') {
                    title = t.stdTitle; desc = t.stdDesc; badge = "Standard VIP"; badgeColor = "bg-blue-500/20 text-blue-300"; marginInfo = "Standard Pool Share";
                }

                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">${title}</h2>
                                <p class="text-xs text-slate-400 mt-1">${desc}</p>
                            </div>
                            <span class="${badgeColor} text-xs px-3 py-1 rounded-full font-medium">${badge}</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">Profit Margin / 利润率分配</span>
                                <div class="text-2xl font-black text-amber-400 mt-2">${marginInfo}</div>
                                <span class="text-xs text-slate-500 mt-1 block">${t.moduleLimit}</span>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">Workbench Status / 工作台状态</span>
                                <div class="text-2xl font-black text-emerald-400 mt-2">Isomorphic Sync</div>
                                <span class="text-xs text-slate-500 mt-1 block">Shared Layout Architecture</span>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">Operator Team Link / 团队管理</span>
                                <div class="text-2xl font-black text-purple-400 mt-2">Active (1-5)</div>
                                <span class="text-xs text-slate-500 mt-1 block">Subordinate Control</span>
                            </div>
                        </div>

                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800 space-y-3">
                            <h3 class="text-sm font-bold text-slate-200">Task Management Workbench / 团队任务协同中枢</h3>
                            <input type="text" placeholder="${t.taskPlaceholder}" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500" onkeydown="if(event.key==='Enter') alert('${t.alertMsg}')">
                            <button onclick="alert('${t.alertMsg}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-medium">${t.taskBtn}</button>
                        </div>
                    </div>
                `;
            } else if (loggedInRole === 'operator-team') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-emerald-400">${t.opTitle}</h2>
                        <p class="text-xs text-slate-400">${t.opDesc}</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm text-slate-300">
                            <p>Status: Execution pipeline operating normally.</p>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
