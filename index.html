<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-[#0F1115]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LXJ HOLDING OS - 欢迎页</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0047A1',
                            darkBg: '#0F1115',
                            cardBg: '#1C1F26',
                            border: '#2A2E38'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full text-slate-100 font-sans flex flex-col justify-between selection:bg-[#0047A1] selection:text-white overflow-hidden">

    <!-- 05 欢迎页容器 (严格匹配设计稿规范) -->
    <div id="screenWelcome" class="relative flex-1 flex flex-col items-center justify-between p-6 max-w-md mx-auto w-full h-full text-center">
        
        <!-- 顶部品牌 Logo 与标题 -->
        <div class="pt-8 space-y-2">
            <p class="text-[10px] tracking-[0.2em] text-slate-400 uppercase">LXJ HOLDING</p>
            <h1 class="text-xl font-bold tracking-wider text-white">LXJ AI BUSINESS PARTNER</h1>
            <p class="text-xs text-blue-400 font-mono">登入界面 UI/UX 设计方案</p>
        </div>

        <!-- 中部科技感晶体与视觉插画区 -->
        <div class="relative my-auto w-full flex flex-col items-center justify-center py-6">
            <!-- 发光背景晕影 -->
            <div class="absolute w-48 h-48 bg-[#0047A1]/20 rounded-full blur-3xl pointer-events-none"></div>
            
            <!-- 宝石蓝高科技晶体图标示意 -->
            <div class="relative w-28 h-28 rounded-3xl bg-gradient-to-tr from-[#0047A1] to-blue-400 p-[1px] shadow-2xl shadow-blue-600/30 mb-6 flex items-center justify-center">
                <div class="w-full h-full bg-[#1C1F26] rounded-3xl flex items-center justify-center">
                    <svg class="w-12 h-12 text-blue-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"></path>
                    </svg>
                </div>
            </div>

            <!-- 核心有力文案 -->
            <div class="space-y-1.5">
                <h3 class="text-sm font-semibold text-white tracking-wide">AI 助力，人类决策，专注经营</h3>
                <p class="text-xs text-slate-400 max-w-[260px] mx-auto leading-relaxed">
                    专业可靠、科技智能、高效便捷、安全信任的下一代商业操作系统。
                </p>
            </div>
        </div>

        <!-- 底部开始按钮 -->
        <div class="w-full pb-8 space-y-4">
            <button onclick="goToLoginMethod()" class="w-full bg-[#0047A1] hover:bg-blue-600 active:scale-[0.98] text-white font-medium py-3.5 rounded-2xl text-sm transition shadow-lg shadow-blue-600/30">
                开始使用
            </button>
            <p class="text-[10px] text-slate-500 font-mono">Designed for LXJ HOLDING OS · 2026</p>
        </div>

    </div>

    <script>
        function goToLoginMethod() {
            alert('即将平滑跳转至：06 登录方式选择页面...');
            // 后续我们将在这里无缝切换至下一个模块的 DOM
        }
    </script>
</body>
</html>
