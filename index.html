<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXJ BUSINESS PARTNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemBlue: '#0f172a',
                        cardDark: '#1e293b',
                        accentOrange: '#f97316',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .device-simulator { transition: all 0.3s ease-in-out; margin: 0 auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <header class="bg-gemBlue border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-md border border-blue-400/30">
                    LXJ
                </div>
                <div>
                    <h1 class="font-extrabold text-sm md:text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        LXJ BUSINESS PARTNER
                    </h1>
                    <p class="text-xs text-slate-400">Empire Command Center</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <select id="roleSelect" onchange="switchRole()" class="bg-slate-900 border border-blue-500/50 text-xs rounded-xl px-3 py-2 text-blue-300 font-medium focus:outline-none">
                    <option value="super-admin">👑 Super Admin (最高统帅大盘)</option>
                    <option value="platinum-vip">💎 白金 VIP 专属通道</option>
                    <option value="standard-vip">⭐ 标准 VIP 专区</option>
                    <option value="business-owner">💼 Business Owner 业务主理人总控</option>
                    <option value="operator-team">⚙️ Operator 团队执行端</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-1 hidden sm:flex items-center space-x-1">
                    <button onclick="setDeviceMode('phone')" id="btn-phone" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">手机</button>
                    <button onclick="setDeviceMode('tablet')" id="btn-tablet" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">平板</button>
                    <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition">电脑</button>
                </div>

                <select id="langSelect" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    <option value="zh">简中</option>
                    <option value="en">EN</option>
                    <option value="bm">BM</option>
                </select>
            </div>
        </div>
    </header>

    <main class="w-full p-4 md:p-6 flex-grow flex justify-center">
        <div id="deviceWrapper" class="w-full max-w-7xl device-simulator space-y-6">
            
            <div id="dynamicMainContent" class="space-y-6">
                <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-white">👑 Super Admin 最高统帅指挥舱</h2>
                            <p class="text-xs text-slate-400 mt-1">全局掌控合伙人、各级 VIP、Business Owner 绩效与利润流水线</p>
                        </div>
                        <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium">统帅核心利润保护中</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">💰 实际净利润看板</span>
                            <div class="text-3xl font-black text-emerald-400 mt-2">8,920 <span class="text-xs text-slate-400">MYR</span></div>
                            <span class="text-xs text-slate-400 mt-1 block">平台基础底线毛利已锁定</span>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">💎 白金 VIP 动态返佣支出</span>
                            <div class="text-3xl font-black text-amber-400 mt-2">2,400 <span class="text-xs text-slate-400">MYR</span></div>
                            <span class="text-xs text-blue-400 mt-1 block">严格执行对赌考核标准</span>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">⚙️ Operator 团队产出效能</span>
                            <div class="text-3xl font-black text-purple-400 mt-2">1 : 3.5 <span class="text-xs text-slate-400">高效运转</span></div>
                            <span class="text-xs text-emerald-400 mt-1 block">杜绝冗余开支</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-gemBlue border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500 mt-12">
        <p class="font-medium tracking-widest text-slate-400">LXJ BUSINESS SYSTEM SINCE 2026</p>
    </footer>

    <script>
        function setDeviceMode(mode) {
            const wrapper = document.getElementById('deviceWrapper');
            const btnPhone = document.getElementById('btn-phone');
            const btnTablet = document.getElementById('btn-tablet');
            const btnDesktop = document.getElementById('btn-desktop');

            [btnPhone, btnTablet, btnDesktop].forEach(b => {
                b.className = "px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition";
            });

            if (mode === 'phone') {
                wrapper.style.maxWidth = '390px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '32px';
                wrapper.style.padding = '12px';
                btnPhone.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else if (mode === 'tablet') {
                wrapper.style.maxWidth = '768px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '24px';
                wrapper.style.padding = '16px';
                btnTablet.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else {
                wrapper.style.maxWidth = '1280px';
                wrapper.style.border = 'none';
                wrapper.style.borderRadius = '0';
                wrapper.style.padding = '0';
                btnDesktop.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            }
        }

        function switchRole() {
            const role = document.getElementById('roleSelect').value;
            const container = document.getElementById('dynamicMainContent');

            if (role === 'super-admin') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">👑 Super Admin 最高统帅指挥舱</h2>
                                <p class="text-xs text-slate-400 mt-1">全局掌控合伙人、各级 VIP、Business Owner 绩效与利润流水线</p>
                            </div>
                            <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-medium">统帅核心利润保护中</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">💰 实际净利润看板</span>
                                <div class="text-3xl font-black text-emerald-400 mt-2">8,920 <span class="text-xs text-slate-400">MYR</span></div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">💎 白金 VIP 动态返佣支出</span>
                                <div class="text-3xl font-black text-amber-400 mt-2">2,400 <span class="text-xs text-slate-400">MYR</span></div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">⚙️ Operator 团队产出效能</span>
                                <div class="text-3xl font-black text-purple-400 mt-2">1 : 3.5 <span class="text-xs text-slate-400">高效运转</span></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (role === 'platinum-vip') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-amber-400">💎 白金 VIP 专属通道 (对赌考核模式)</h2>
                        <p class="text-xs text-slate-400">基础返佣比例标准。当月销售额若未达统帅制定的业绩红线，最高返佣自动锁定无法提取。</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm">
                            <p class="text-slate-300">📊 当前月份业绩达成度：<span class="text-amber-400 font-bold">待达标 (基础返佣生效中)</span></p>
                        </div>
                    </div>
                `;
            } else if (role === 'standard-vip') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-blue-400">⭐ 标准 VIP 专区</h2>
                        <p class="text-xs text-slate-400">标准合作返佣与日常订单管理通道。</p>
                    </div>
                `;
            } else if (role === 'business-owner') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h2 class="text-xl font-bold text-purple-400">💼 Business Owner 业务主理人总控后台</h2>
                            <span class="bg-red-500/20 text-red-300 text-xs px-2 py-1 rounded">部门成本与绩效考核</span>
                        </div>
                        <p class="text-xs text-slate-400">在此自主指派 Operator 团队工作任务，系统将自动核算该部门为统帅带来的实际净收益贡献：</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                            <input type="text" placeholder="输入要下发给 Operator 团队的新增任务..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500" onkeydown="if(event.key==='Enter') alert('任务已下发，系统已开启监控！')">
                            <button onclick="alert('任务下发成功！')" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-xs">发布任务</button>
                        </div>
                    </div>
                `;
            } else if (role === 'operator-team') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-emerald-400">⚙️ Operator 团队执行端</h2>
                        <p class="text-xs text-slate-400">全体 Operator 严格执行 Business Owner 指派的工作任务，按效分红，严禁冗余。</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm text-slate-300">
                            <p>📌 状态：当前部门产出正常，实时数据已同步。</p>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
