<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LXJ BUSINESS PARTNER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemBlue: '#0f172a',
                        cardDark: '#1e293b',
                        accentOrange: '#f97316',
                        accentRed: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .device-simulator { transition: all 0.3s ease-in-out; margin: 0 auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <header class="bg-gemBlue border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchPage('home')">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-md border border-blue-400/30">
                    LXJ
                </div>
                <div>
                    <h1 class="font-extrabold text-sm md:text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        LXJ BUSINESS PARTNER
                    </h1>
                    <p class="text-xs text-slate-400">Empire Command Center</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <select id="roleSelect" onchange="switchRole()" class="bg-slate-900 border border-blue-500/50 text-xs rounded-xl px-3 py-2 text-blue-300 font-medium focus:outline-none">
                    <option value="super-admin">👑 Super Admin (最高统帅大盘)</option>
                    <option value="platinum-vip">💎 白金 VIP (Platinum VIP 专属通道)</option>
                    <option value="standard-vip">⭐ 标准 VIP (Standard VIP)</option>
                    <option value="business-owner">💼 Business Owner (业务主理人总控)</option>
                    <option value="operator-team">⚙️ Operator 团队 (由主理人自主指派管理)</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-1 hidden sm:flex items-center space-x-1">
                    <button onclick="setDeviceMode('phone')" id="btn-phone" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">📱 手机</button>
                    <button onclick="setDeviceMode('tablet')" id="btn-tablet" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">📱 平板</button>
                    <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition">💻 电脑</button>
                </div>

                <select id="langSelect" onchange="changeLanguage()" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    <option value="zh"> 简中</option>
                    <option value="en"> EN</option>
                    <option value="bm"> BM</option>
                </select>
            </div>
        </div>
    </header>

    <main class="w-full p-4 md:p-6 flex-grow flex justify-center">
        <div id="deviceWrapper" class="w-full max-w-7xl device-simulator space-y-6">
            
            <div id="dynamicMainContent" class="space-y-6">
                <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                        <div>
                            <h2 class="text-xl font-bold text-white">👑 Super Admin 统帅最高指挥舱</h2>
                            <p class="text-xs text-slate-400 mt-1">全局掌控合伙人、各级 VIP、Business Owner 绩效与自动化流水线</p>
                        </div>
                        <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-medium">最高权限在线</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">📈 本周帝国总业绩</span>
                            <div class="text-3xl font-black text-white mt-2">13,800 <span class="text-xs text-slate-400">MYR</span></div>
                            <span class="text-xs text-emerald-400 mt-1 block">↑ 相比上周增长 18.2%</span>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">💎 活跃 VIP 矩阵</span>
                            <div class="text-3xl font-black text-amber-400 mt-2">42 <span class="text-xs text-slate-400">人 (白金:12 / 标准:30)</span></div>
                            <span class="text-xs text-blue-400 mt-1 block">转化率极佳</span>
                        </div>
                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                            <span class="text-xs text-slate-400 font-medium">💼 Business Owner 独立主理</span>
                            <div class="text-3xl font-black text-purple-400 mt-2">5 <span class="text-xs text-slate-400">个独立业务矩阵</span></div>
                            <span class="text-xs text-emerald-400 mt-1 block">Operator 团队运转正常</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-gemBlue border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500 mt-12">
        <p class="font-medium tracking-widest text-slate-400">LXJ BUSINESS DEVERLOMENT SYSTEM @ SINCE 2026</p>
    </footer>

    <script>
        function setDeviceMode(mode) {
            const wrapper = document.getElementById('deviceWrapper');
            const btnPhone = document.getElementById('btn-phone');
            const btnTablet = document.getElementById('btn-tablet');
            const btnDesktop = document.getElementById('btn-desktop');

            [btnPhone, btnTablet, btnDesktop].forEach(b => {
                b.className = "px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition";
            });

            if (mode === 'phone') {
                wrapper.style.maxWidth = '390px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '32px';
                wrapper.style.padding = '12px';
                btnPhone.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else if (mode === 'tablet') {
                wrapper.style.maxWidth = '768px';
                wrapper.style.border = '8px solid #334155';
                wrapper.style.borderRadius = '24px';
                wrapper.style.padding = '16px';
                btnTablet.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else {
                wrapper.style.maxWidth = '1280px';
                wrapper.style.border = 'none';
                wrapper.style.borderRadius = '0';
                wrapper.style.padding = '0';
                btnDesktop.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            }
        }

        function switchRole() {
            const role = document.getElementById('roleSelect').value;
            const container = document.getElementById('dynamicMainContent');

            if (role === 'super-admin') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                            <div>
                                <h2 class="text-xl font-bold text-white">👑 Super Admin 统帅最高指挥舱</h2>
                                <p class="text-xs text-slate-400 mt-1">全局掌控合伙人、各级 VIP、Business Owner 绩效与自动化流水线</p>
                            </div>
                            <span class="bg-blue-500/20 text-blue-400 text-xs px-3 py-1 rounded-full font-medium">最高权限在线</span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">📈 本周帝国总业绩</span>
                                <div class="text-3xl font-black text-white mt-2">13,800 <span class="text-xs text-slate-400">MYR</span></div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">💎 活跃 VIP 矩阵</span>
                                <div class="text-3xl font-black text-amber-400 mt-2">42 <span class="text-xs text-slate-400">人</span></div>
                            </div>
                            <div class="bg-slate-900 p-5 rounded-xl border border-slate-800">
                                <span class="text-xs text-slate-400 font-medium">💼 Business Owner 总控</span>
                                <div class="text-3xl font-black text-purple-400 mt-2">5 <span class="text-xs text-slate-400">个独立业务</span></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (role === 'platinum-vip') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-amber-400">💎 白金 VIP 专属尊贵特权大盘</h2>
                        <p class="text-xs text-slate-400">欢迎尊贵的白金 VIP。您可在此享受专属顶级开料折扣、极速财务审批通道及高级 Affiliate 返佣特权。</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm">
                            <p class="text-slate-300">⭐ 当前白金专属返佣比例：<span class="text-amber-400 font-bold">最高 35%</span></p>
                        </div>
                    </div>
                `;
            } else if (role === 'standard-vip') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-blue-400">⭐ 标准 VIP 专区</h2>
                        <p class="text-xs text-slate-400">查看您的标准合作数据、日常订单与 Affiliate 推广链接。</p>
                    </div>
                `;
            } else if (role === 'business-owner') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h2 class="text-xl font-bold text-purple-400">💼 Business Owner (业务主理人总控后台)</h2>
                            <span class="bg-purple-500/20 text-purple-300 text-xs px-2 py-1 rounded">可自主指派 Operator 团队</span>
                        </div>
                        <p class="text-xs text-slate-400">在此页面，您可以自主为您的业务部门创建工作、指派下方 Operator 1~5 成员处理具体任务：</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3">
                            <input type="text" placeholder="输入要指派给 Operator 团队的新工作任务..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500" onkeydown="if(event.key==='Enter') alert('任务已成功下发给 Operator 团队！')">
                            <button onclick="alert('任务下发成功！')" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-xs">发布任务给 Operator 团队</button>
                        </div>
                    </div>
                `;
            } else if (role === 'operator-team') {
                container.innerHTML = `
                    <div class="bg-cardDark p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-emerald-400">⚙️ Operator 工作执行矩阵 (由主理人指派)</h2>
                        <p class="text-xs text-slate-400">包含 Operator 1 (财务与库存总监)、Operator 2 (开料生产专员)、Operator 3 (Affiliate 流量专员)、Operator 4 (多语客服专员)、Operator 5 (AI 巡检专员)。</p>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 text-sm text-slate-300">
                            <p>📌 状态：等待 Business Owner 指派当前批次任务。</p>
                        </div>
                    </div>
                `;
            }
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            if(lang === 'en') alert('Language switched to English.');
            else if(lang === 'bm') alert('Bahasa Melayu dipilih.');
        }
    </script>
</body>
</html>
