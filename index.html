        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gemBlue: '#0f172a',
                        cardDark: '#1e293b',
                        accentOrange: '#f97316',
                        accentRed: '#ef4444'
                    }
                }
            }
        }

        body { background-color: #0b0f19; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .device-simulator { transition: all 0.3s ease-in-out; margin: 0 auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <!-- 顶栏 -->
    <header id="appHeader" class="bg-gemBlue border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-lg hidden">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3 cursor-pointer">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-xl flex items-center justify-center font-bold text-xl text-white shadow-md border border-blue-400/30">
                    LXJ
                </div>
                <div>
                    <h1 class="font-extrabold text-sm md:text-lg tracking-wider bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        LXJ HOLDING OS
                    </h1>
                    <p class="text-xs text-slate-400">Super Admin Supreme Command Center</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <span id="currentRoleBadge" class="text-xs bg-slate-900 border border-blue-500/50 text-blue-300 px-3 py-1.5 rounded-xl font-medium"></span>
            </div>

            <div class="flex items-center space-x-2">
                <div class="bg-slate-900 border border-slate-700 rounded-xl p-1 hidden sm:flex items-center space-x-1">
                    <button onclick="setDeviceMode('phone')" id="btn-phone" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">手机</button>
                    <button onclick="setDeviceMode('tablet')" id="btn-tablet" class="px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition">平板</button>
                    <button onclick="setDeviceMode('desktop')" id="btn-desktop" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition">电脑</button>
                </div>

                <select id="langSelect" onchange="changeLanguage()" class="bg-slate-800 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none">
                    <option value="zh">简中</option>
                    <option value="en">EN</option>
                    <option value="bm">BM</option>
                </select>

                <button onclick="logout()" id="btnLogout" class="bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 text-xs px-3 py-1.5 rounded-xl transition font-medium">退出</button>
            </div>
        </div>
    </header>

            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-gradient-to-br from-blue-600 to-indigo-800 rounded-2xl mx-auto flex items-center justify-center font-bold text-2xl text-white shadow-lg border border-blue-400/30">
                    LXJ
                </div>
                <h2 id="loginTitle" class="text-xl font-extrabold text-white tracking-wider">LXJ EMPIRE GATEWAY</h2>
                <p id="loginSubtitle" class="text-xs text-slate-400">请选择身份或输入授权凭证登入系统</p>
            </div>

            <!-- 语言切换按钮 -->

                <button onclick="setLoginLang('en')" id="l-en" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition">EN</button>
                <button onclick="setLoginLang('bm')" id="l-bm" class="px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition">BM</button>
            </div>

                <div>
                    <label id="lblRoleSelect" class="block text-xs font-medium text-slate-300 mb-1.5">选择登入角色身份</label>

                        <option value="super-admin">Super Admin (最高统帅 - 绝对所有权)</option>
                        <option value="business-owner">Business Owner (知识改进者 / 5%)</option>
                        <option value="platinum-vip">Platinum VIP (白金分佣 / 3%)</option>
                        <option value="standard-vip">Standard VIP (普通合伙人 / 1%)</option>
                        <option value="operator-team">Operator Team (执行团队 / 0%)</option>
                    </select>
                </div>

                <div>
                    <label id="lblToken" class="block text-xs font-medium text-slate-300 mb-1.5">安全授权令牌 / Security Token</label>
                    <div class="relative">
                        <input type="password" id="loginTokenInput" value="lxj-security-2026" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 pr-10">
                        <button type="button" onclick="toggleTokenVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white text-xs font-bold">👁️</button>
                    </div>
                </div>

                <button onclick="handleLogin()" id="btnLoginText" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition tracking-wider">
                    安全登入指挥系统
                </button>

                <div class="text-center pt-2">
                    <button onclick="toggleAuthView('register')" id="toRegisterText" class="text-xs text-blue-400 hover:underline">没有账号？点击前往新用户注册 &rarr;</button>
                </div>
            </div>

            <!-- 新用户注册表单 -->
            <div id="registerFormSection" class="space-y-4 hidden">
                <div>
                    <label id="lblRegUser" class="block text-xs font-medium text-slate-300 mb-1">新用户全名 / Full Name</label>
                    <input type="text" id="regNameInput" placeholder="请输入您的名字" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label id="lblRegRole" class="block text-xs font-medium text-slate-300 mb-1">申请绑定身份 / Apply Role</label>
                    <select id="regRoleSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="business-owner">Business Owner (申请模块知识改进者 / 5%)</option>
                        <option value="platinum-vip">Platinum VIP (申请白金分佣 / 3%)</option>
                        <option value="standard-vip">Standard VIP (申请普通合伙人 / 1%)</option>
                        <option value="operator-team">Operator Team (申请执行团队 / 0%)</option>
                    </select>
                </div>
                <div>
                    <label id="lblRegToken" class="block text-xs font-medium text-slate-300 mb-1">设置安全访问口令 / Set Password</label>
                    <input type="password" id="regTokenInput" value="lxj-new-2026" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                </div>

                <button onclick="handleRegister()" id="btnRegisterText" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition tracking-wider">
                    提交注册并开通账号
                </button>

                <div class="text-center pt-2">
                    <button onclick="toggleAuthView('login')" id="toLoginText" class="text-xs text-slate-400 hover:underline">&larr; 已有账号？返回安全登入</button>
                </div>
            </div>

        </div>

        <!-- 2. 主指挥工作台界面 -->
        <div id="dashboardView" class="w-full max-w-7xl device-simulator space-y-6 hidden">
            <div id="dynamicMainContent" class="space-y-6">
                <!-- 动态渲染区域 -->
            </div>
        </div>

    </main>

        <p class="font-medium tracking-widest text-slate-400">LXJ HOLDING OS SINCE 2026 - EMPIRE COMMAND & IP OWNERSHIP</p>

        function setLoginLang(lang) {
            currentLang = lang;
            document.getElementById('langSelect').value = lang;
            
            ['zh', 'en', 'bm'].forEach(l => {
                const btn = document.getElementById(`l-${l}`);
                if (l === lang) {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white transition";
                } else {
                    btn.className = "px-3 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-400 transition";
                }
            });

            const t = langData[lang];
            document.getElementById('loginTitle').innerText = t.loginTitle;
            document.getElementById('loginSubtitle').innerText = t.loginSubtitle;
            document.getElementById('lblRoleSelect').innerText = t.lblRoleSelect;
            document.getElementById('lblToken').innerText = t.lblToken;
            document.getElementById('btnLoginText').innerText = t.btnLoginText;
            document.getElementById('toRegisterText').innerText = t.toRegisterText;
            document.getElementById('lblRegUser').innerText = t.lblRegUser;
            document.getElementById('lblRegRole').innerText = t.lblRegRole;
            document.getElementById('lblRegToken').innerText = t.lblRegToken;
            document.getElementById('btnRegisterText').innerText = t.btnRegisterText;
            document.getElementById('toLoginText').innerText = t.toLoginText;
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            setLoginLang(currentLang);
            if (loggedInRole) {
                renderDashboard();
            }
        }

        function toggleAuthView(view) {
            const loginSec = document.getElementById('loginFormSection');
            const regSec = document.getElementById('registerFormSection');
            if (view === 'register') {
                loginSec.classList.add('hidden');
                regSec.classList.remove('hidden');
            } else {
                regSec.classList.add('hidden');
                loginSec.classList.remove('hidden');
            }
        }

        function toggleTokenVisibility() {
            const input = document.getElementById('loginTokenInput');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function handleLogin() {
            const role = document.getElementById('loginRoleSelect').value;
            const token = document.getElementById('loginTokenInput').value;
            if (!token) { alert("Please enter security token!"); return; }
            loggedInRole = role;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appHeader').classList.remove('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            renderDashboard();
        }

        function handleRegister() {
            const name = document.getElementById('regNameInput').value;
            const role = document.getElementById('regRoleSelect').value;
            const token = document.getElementById('regTokenInput').value;
            if (!name || !token) { alert("Please fill in all registration fields!"); return; }
            alert(`Registration successful! Welcome ${name}. Logging into your dashboard...`);
            loggedInRole = role;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appHeader').classList.remove('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            renderDashboard();
        }

        function logout() {
            loggedInRole = '';
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('appHeader').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            toggleAuthView('login');
        }

        function copyShareLink() {
            const t = langData[currentLang];
            const dummyLink = "https://lxj-holding.os/ref?agent=" + loggedInRole + "&ref_id=88899";
            navigator.clipboard.writeText(dummyLink).then(() => { alert(t.shareCopied); });
        }

        function setDeviceMode(mode) {
            const wrapper = document.getElementById('dashboardView');
            const btnPhone = document.getElementById('btn-phone');
            const btnTablet = document.getElementById('btn-tablet');
            const btnDesktop = document.getElementById('btn-desktop');

            [btnPhone, btnTablet, btnDesktop].forEach(b => {
                b.className = "px-2.5 py-1 rounded-lg text-xs font-medium text-slate-400 hover:text-white transition";
            });

            if (mode === 'phone') {
                wrapper.style.maxWidth = '390px'; wrapper.style.border = '8px solid #334155'; wrapper.style.borderRadius = '32px'; wrapper.style.padding = '12px';
                btnPhone.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else if (mode === 'tablet') {
                wrapper.style.maxWidth = '768px'; wrapper.style.border = '8px solid #334155'; wrapper.style.borderRadius = '24px'; wrapper.style.padding = '16px';
                btnTablet.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            } else {
                wrapper.style.maxWidth = '1280px'; wrapper.style.border = 'none'; wrapper.style.borderRadius = '0'; wrapper.style.padding = '0';
                btnDesktop.className = "px-2.5 py-1 rounded-lg text-xs font-medium bg-blue-600 text-white shadow transition";
            }
        }
